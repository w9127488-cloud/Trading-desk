<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Desk</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d3dae1;--acc:#0f6e8c;--buy:#1e7f5c;--sell:#b8412f;--warn:#a86a0c}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--card:#18222c;--ink:#e6ecf1;--mute:#93a2af;--line:#2b3947;--acc:#5bb8d6;--buy:#4cc59a;--sell:#ee7f6c;--warn:#e0a443}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.tabs button{padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 14px inherit;cursor:pointer;text-align:center}
.tabs button[aria-pressed=true]{outline:2px solid var(--acc)}
.tabs small{display:block;font-weight:500;font-size:12px}
.layout{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:860px){.layout{grid-template-columns:1.5fr 1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
#tv{height:420px}
.sig{font-size:36px;font-weight:600;margin:0}
.BUY,.buy{color:var(--buy)}.SELL,.sell{color:var(--sell)}.WAIT,.wait{color:var(--warn)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 2px}.meter i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-top:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
ul{margin:8px 0 0;padding-left:18px}li{margin:3px 0}.small{font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input{font:16px inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
</style>
</head>
<body>
<main>
<div class="bar"><h1>Signal Desk</h1><span class="chip" id="meta">Loading…</span></div>
<div class="tabs" id="tabs"></div>
<div class="layout">
 <div><div class="panel"><div id="tv"></div></div>
  <div class="panel"><h2>Recent signals</h2><table id="log"></table></div></div>
 <div>
  <div class="panel" aria-live="polite"><p class="sig wait" id="dir">…</p>
   <div class="meter"><i id="bar" style="width:0"></i></div><div class="small" id="conf"></div>
   <table id="out"></table><ul id="warn"></ul></div>
  <div class="panel"><h2>Why</h2><ul id="why"></ul><p class="small" id="rd"></p></div>
  <div class="panel"><h2>Account</h2><div class="grid">
   <label>Balance $<input id="bal" type="number" value="1000"></label>
   <label>Risk %<input id="rp" type="number" step="0.25" value="1"></label>
   <label>Daily cap %<input id="cap" type="number" step="0.5" value="3"></label></div>
   <p class="small">Confidence is a rules-based confluence score, not a win probability. Not financial advice.</p></div>
 </div>
</div>
</main>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const $=id=>document.getElementById(id),SYM={XAU:'OANDA:XAUUSD',EUR:'OANDA:EURUSD',GBP:'OANDA:GBPUSD',BTC:'BITSTAMP:BTCUSD'};
const dark=matchMedia('(prefers-color-scheme: dark)').matches;
let cur='XAU',D=null;
['bal','rp','cap'].forEach(i=>{const v=localStorage.getItem(i);if(v)$(i).value=v;$(i).onchange=()=>{localStorage.setItem(i,$(i).value);load()}});
function chart(){$('tv').innerHTML='';new TradingView.widget({container_id:'tv',width:'100%',height:420,symbol:SYM[cur],interval:'60',theme:dark?'dark':'light',style:'1',locale:'en',allow_symbol_change:false,studies:['RSI@tv-basicstudies','MACD@tv-basicstudies']})}
function pick(k){cur=k;chart();render()}
const f=(x,d)=>x==null?'-':(+x).toFixed(d);
function render(){
 if(!D)return;
 $('tabs').innerHTML=D.results.map(r=>`<button data-k="${r.asset}" aria-pressed="${r.asset==cur}">${r.asset}<small class="${r.signal||'WAIT'}">${r.error?'error':r.signal+' '+r.conf+'%'}</small></button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>pick(b.dataset.k));
 const r=D.results.find(x=>x.asset==cur);
 $('meta').textContent='Updated '+new Date(D.time).toLocaleTimeString()+(D.session.closed?' · forex closed':D.session.overlap?' · overlap':'');
 if(r.error){$('dir').textContent='Data error';$('warn').innerHTML='<li>'+r.error+'</li>';return}
 $('dir').textContent=r.signal==='WAIT'?'Stand aside':r.signal;$('dir').className='sig '+r.signal;
 $('bar').style.width=r.conf+'%';$('conf').textContent='Confluence '+r.conf+'% · price '+f(r.price,r.dec);
 const d=r.dec;
 $('out').innerHTML=r.signal==='WAIT'?'':[['Entry (market)',f(r.entry,d)],['Stop loss',f(r.stop,d)],['Take profit 1 (1:2)',f(r.tp1,d)],['Take profit 2 (1:3)',f(r.tp2,d)],['Risk','$'+f(r.riskUsd,2)],['Lot size',f(r.lots,2)],['Max trades today',r.maxTrades],['At TP1','close half, stop to breakeven']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('');
 $('warn').innerHTML=r.warn.map(w=>'<li>'+w+'</li>').join('');
 $('why').innerHTML=r.why.map(w=>'<li>'+w+'</li>').join('')||'<li>No factor is leaning either way.</li>';
 const L=r.levels;$('rd').textContent=`ATR(14) ${f(r.atr,d)} · RSI ${r.readings.rsi} · 5d high ${f(L.high5d,d)} · 5d low ${f(L.low5d,d)} · prev day ${f(L.prevDayHigh,d)}/${f(L.prevDayLow,d)}`+(r.readings.fearGreed!=null?' · Fear&Greed '+r.readings.fearGreed:'');
 $('log').innerHTML=D.log.slice(0,10).map(x=>`<tr><td>${new Date(x.time).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} ${x.asset}</td><td class="${x.signal}">${x.signal} @ ${f(x.entry,x.dec)} (${x.conf}%)</td></tr>`).join('')||'<tr><td>No signals yet</td><td></td></tr>';
}
async function load(){
 try{const q=`balance=${$('bal').value}&risk=${$('rp').value}&cap=${$('cap').value}`;D=await (await fetch('/api/signals?'+q)).json();render()}
 catch(e){$('meta').textContent='Connection error, retrying…'}
}
chart();load();setInterval(load,60000);
</script>
</body>
</html>
